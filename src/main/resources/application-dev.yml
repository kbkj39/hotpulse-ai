spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hotpulse}
    username: ${SPRING_DATASOURCE_USERNAME:hotpulse}
    password: ${SPRING_DATASOURCE_PASSWORD:hotpulse123}

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hotpulse}
    password: ${RABBITMQ_PASSWORD:hotpulse123}

  jpa:
    show-sql: true

iwencai:
  base-url: https://openapi.iwencai.com
  api-key: ${IWENCAI_API_KEY:}

logging:
  level:
    com.hotpulse: DEBUG
    org.springframework.ai: DEBUG
